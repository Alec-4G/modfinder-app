<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ModFinder</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            background: #0d1117;
            color: white;
            font-family: Arial, sans-serif;
            padding: 20px;
        }
        h1 {
            text-align: center;
            margin-bottom: 20px;
            font-size: 24px;
        }
        .card {
            background: #161b22;
            border: 1px solid #30363d;
            border-radius: 12px;
            padding: 16px;
            margin-bottom: 12px;
        }
        .card h3 {
            margin-bottom: 4px;
        }
        .card .author {
            color: #58a6ff;
            font-size: 13px;
            margin-bottom: 8px;
        }
        .card .desc {
            color: #8b949e;
            font-size: 14px;
            margin-bottom: 12px;
        }
        .btn {
            background: #238636;
            color: white;
            border: none;
            padding: 8px 20px;
            border-radius: 20px;
            font-size: 14px;
            cursor: pointer;
        }
        .btn:hover {
            background: #2ea043;
        }
        #status {
            text-align: center;
            padding: 10px;
            color: #8b949e;
            font-size: 13px;
            margin-top: 20px;
        }
        .mod-icon {
            font-size: 28px;
            margin-bottom: 8px;
        }
    </style>
</head>
<body>
    <h1>⛏️ ModFinder</h1>
    <div id="modList"></div>
    <div id="status">Нажми "Скачать" — бот отправит файл</div>

    <script>
        // ============================================
        // 1. ПОДКЛЮЧАЕМ ТЕЛЕГРАМ
        // ============================================
        const tg = window.Telegram.WebApp;
        tg.ready();
        console.log('✅ Telegram WebApp готов');

        // ============================================
        // 2. ДАННЫЕ МОДОВ (ДОБАВЛЯЙ СВОИ)
        // ============================================
        const mods = [
            {
                name: 'OptiFine',
                author: 'sp614x',
                desc: 'Оптимизация FPS и шейдеры',
                file: 'OptiFine_1.21.11_HD_U_J9.jar',
                icon: '⚡'
            },
            {
                name: 'Forge',
                author: 'Forge Team',
                desc: 'Установщик Forge',
                file: 'forge-1.21.11-61.2.0-installer.jar',
                icon: '🔧'
            }
        ];

        // ============================================
        // 3. ФУНКЦИЯ ОТПРАВКИ
        // ============================================
        function downloadMod(fileName) {
            console.log('🔽 Нажата кнопка для:', fileName);
            tg.sendData('DOWNLOAD:' + fileName);
            tg.showPopup({
                title: '✅ Отправлено!',
                message: 'Бот отправляет мод в чат',
                buttons: [{ type: 'ok' }]
            });
        }

        // ============================================
        // 4. ОТОБРАЖЕНИЕ КАРТОЧЕК
        // ============================================
        const list = document.getElementById('modList');

        mods.forEach(mod => {
            const card = document.createElement('div');
            card.className = 'card';
            card.innerHTML = `
                <div class="mod-icon">${mod.icon}</div>
                <h3>${mod.name}</h3>
                <div class="author">${mod.author}</div>
                <div class="desc">${mod.desc}</div>
                <button class="btn" data-file="${mod.file}">⬇️ Скачать</button>
            `;

            const btn = card.querySelector('.btn');
            btn.addEventListener('click', function() {
                const file = this.dataset.file;
                downloadMod(file);
            });

            list.appendChild(card);
        });

        console.log('✅ Загружено модов:', mods.length);
    </script>
</body>
</html>
