<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ModFinder</title>
    <link rel="stylesheet" href="style.css">
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
</head>
<body>
    <header class="header">
        <div class="header-content">
            <div class="logo">
                <span class="logo-icon">⛏️</span>
                <span class="logo-text">ModFinder</span>
            </div>
        </div>
    </header>

    <div class="search-section">
        <input type="text" id="searchInput" placeholder="🔍 Искать моды...">
    </div>

    <div class="results-info">
        <span id="resultsCount">Показано 0 модов</span>
    </div>

    <div id="modList" class="mod-grid"></div>

    <footer class="footer">
        <p>Нажми "Скачать" — бот пришлёт .jar файл в чат</p>
    </footer>

    <script src="script.js"></script>
</body>
</html>
