<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>ModFinder</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>

<header class="topbar">
    <div class="brand">
        <span class="brand-mark">⛏</span>
        <span class="brand-name">ModFinder</span>
    </div>
    <div class="search-wrap">
        <svg class="search-icon" viewBox="0 0 24 24" fill="none"><path d="M11 19a8 8 0 1 0 0-16 8 8 0 0 0 0 16Zm10 2-4.35-4.35" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
        <input type="text" id="searchInput" placeholder="Поиск модов…" autocomplete="off">
        <button id="clearSearch" class="clear-btn" style="display:none;" aria-label="Очистить">✕</button>
    </div>
</header>

<div class="layout">
    <aside class="sidebar">
        <div class="sidebar-title">Категории</div>
        <nav class="category-list">
            <button class="category-btn active" data-category="all">
                <span class="cat-icon">▦</span> Все моды
            </button>
            <button class="category-btn" data-category="optimization">
                <span class="cat-icon">⚡</span> Оптимизация
            </button>
            <button class="category-btn" data-category="building">
                <span class="cat-icon">🏗</span> Строительство
            </button>
            <button class="category-btn" data-category="utility">
                <span class="cat-icon">🧩</span> Утилиты
            </button>
        </nav>
    </aside>

    <main class="content">
        <div class="results-bar">
            <span id="resultsCount">Показано 0 модов</span>
        </div>
        <div id="modList" class="mod-list"></div>
    </main>
</div>

<!-- ===== АДМИН-ПАНЕЛЬ ===== -->
<div id="adminPanel" class="admin-panel" style="display:none;">
    <div class="admin-card">
        <div class="admin-header">
            <h2>Добавить мод</h2>
            <button type="button" class="admin-close" onclick="document.getElementById('adminPanel').style.display='none';">✕</button>
        </div>
        <form id="addModForm">
            <label>Название</label>
            <input type="text" id="modName" placeholder="Название мода" required>

            <label>Автор</label>
            <input type="text" id="modAuthor" placeholder="Ник автора" required>

            <label>Версия</label>
            <input type="text" id="modVersion" placeholder="Например 1.21.11" required>

            <label>Описание</label>
            <textarea id="modDescription" rows="3" placeholder="Коротко о моде" required></textarea>

            <label>Категория</label>
            <select id="modCategory">
                <option value="optimization">Оптимизация</option>
                <option value="building">Строительство</option>
                <option value="utility">Утилиты</option>
            </select>

            <label>Файл (.jar)</label>
            <input type="file" id="modFile" accept=".jar" required>

            <button type="submit" class="btn-primary">Загрузить мод</button>
            <div id="uploadStatus"></div>
        </form>
    </div>
</div>

<script src="script.js"></script>
</body>
</html>
